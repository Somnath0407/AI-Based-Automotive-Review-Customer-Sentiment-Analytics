    - acceleration
    - power
    - rpm
    - cylinder
    - turbo
    - turbocharged
    - performance
  Battery:
    - battery
    - ev battery
    - charge
    - charged
    - charging
    - range
    - electric range
    - battery life
    - battery capacity
    - kwh
  Mileage:
    - mileage
    - fuel economy
    - fuel efficiency
