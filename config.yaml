# ─────────────────────────────────────────────────────────
#  config.yaml  –  Central configuration for ABSA system
# ─────────────────────────────────────────────────────────

# ── Automotive aspect taxonomy ─────────────────────────
aspects:
  - Vehicle
  - Engine
  - Battery
  - Mileage
  - Safety
  - Comfort
  - Service
  - Infotainment
  - Price

# ── Sentiment labels ───────────────────────────────────
sentiment_labels:
  - Positive
  - Negative
  - Neutral

# ── Aspect keyword map (used by keyword-based extractor)
aspect_keywords:
