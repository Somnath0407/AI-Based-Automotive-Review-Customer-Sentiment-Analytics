# ── Model configuration ────────────────────────────────
models:
  bert:
    name: bert-base-uncased
    display_name: "BERT (bert-base-uncased)"
    max_length: 256
    num_labels: 3

  xlmr:
    name: xlm-roberta-base
    display_name: "XLM-RoBERTa (xlm-roberta-base)"
    max_length: 256
    num_labels: 3

# ── Training configuration ─────────────────────────────
training:
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 5
  warmup_steps: 100
  weight_decay: 0.01
  seed: 42
  dataset_split:
    train: 0.70
    val: 0.15
    test: 0.15
  output_dir: models/checkpoints

# ── Dataset configuration ──────────────────────────────
dataset:
  required_columns:
    - Review
    - Aspect
    - Sentiment
  max_file_size_mb: 50
  accepted_extensions:
    - .csv
    - .json

# ── Export configuration ────────────────────────────────
export:
  output_dir: exports
